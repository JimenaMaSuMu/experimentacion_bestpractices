[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "experimentacion_bestpractices"
version = "0.0.1"
description = "Implementación de buenas prácticas de MLOps mediante experimentación y seguimiento de modelos de Machine Learning con MLflow."
authors = [
  { name = "Jimena" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["experimentacion_bestpractices"]
force_sort_within_sections = true


